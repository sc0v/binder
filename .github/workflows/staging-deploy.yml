name: "Staging: deploy"
run-name: "Staging: deploy ${{ github.event.workflow_run.display_title }}"

on:
  workflow_run:
    workflows:
      - "Staging: build"
    types:
      - completed
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ssh and podman run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            podman stop binder
            podman rm binder
            image_id=`podman images --format "table {{.Repository}} {{.ID}}" | grep "ghcr.io/sc0v/binder-staging" | grep -oE '[^ ]+$'`
            podman rmi "$image_id"
            # Runs with RAILS_ENV=staging (set in the image): it needs its own
            # MySQL database and settings, as production does
            podman run \
              --name binder \
              --network binder-mysql-network \
              -dt \
              -p 3000:3000/tcp \
              --env-file /home/sc0v/binder-staging.env \
              -v binder-private:/build/config/private \
              -v binder-logs:/build/log \
              ghcr.io/sc0v/binder-staging:master
