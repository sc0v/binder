# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at http://guides.rubyonrails.org/i18n.html.

en:
  unauthorized:
    manage:
      all: Not authorized to %{action} %{subject}.
    new:
      faq: Not authorized to add %{action} %{subject}.

  time:
    formats:
      timestamp: "%Y-%m-%d %H:%M (%a)"

  # Controllers
  applets:
    ppe_collection:
      index:
        not_found: That hardhat wasn't found. Scan it again.
        already_checked_in: That hardhat is already checked in.
    wristband_lookup:
      index:
        no_participant: No participant found for that ID.
    ppe_distribution:
      load_step_one:
        no_participant: No participant found with that information.
      load_step_three:
        no_hardhat: No hardhat found with that information.
        no_organization: No organization selected.
  application:
    not_registered: The ID card you swiped isn't linked to an account yet. Register with your Andrew email.
    auth_error: Binder couldn't connect to CMU sign-in. Try again in a few minutes.
  charge_types:
    destroy:
      warn: Cannot delete a charge type until all charges of that type are deleted.
      notice: The charge type was deleted.
  charges:
    create:
      notice: The charge was created.
  downtime:
    downtime:
      alert: You don't have access to downtime.
    toggle:
      blank_organization: Select an organization.
  event_types:
    create:
      notice: The event type was created.
    update:
      notice: The event type was updated.
    destroy:
      notice: The event type was deleted.
  events:
    create:
      notice: The event was created.
    update:
      notice: The event was updated.
    destroy:
      notice: The event was deleted.
  home:
    search:
      blank_query: Enter a search term.
  memberships:
    upload_csv:
      csv_not_uploaded: The CSV wasn't uploaded. Choose a CSV file and try again.
    cancel:
      notice: Canceled. No members were added.
    commit:
      notice: The members were added.
    create:
      notice: The member was added.
      error: The member couldn't be added. Check the entry and try again.
    old_create:
      notice: Person updated.
  notes:
    create:
      notice: The note was created.
      save_error: The note couldn't be saved. Check it and try again.
    destroy:
      notice: The note was deleted.
      alert: The note couldn't be deleted. Try again.
    show:
      archived: That note has been archived.
    archive:
      notice: The note was archived.
    unarchive:
      notice: The note was unarchived.

  organization_build_steps:
    create:
      notice: The build step was added.
    update:
      alert: The build step couldn't be updated. Check it and try again.
    destroy:
      notice: The build step was deleted.
  organization_members:
    create:
      member_updated: The member was updated.
    remove_staged:
      notice: The new members were saved.
  scissor_lift_checkouts:
    checkout:
      unauthorized: You aren't authorized to check out a scissor lift.
      no_scissor_lifts: Add at least one scissor lift to check out.
      no_participant: Select a valid person to check out.
    renew:
      no_scissor_lift: Select a scissor lift.
      all_checked_out: All scissor lifts are currently checked out.
    checkin:
      no_scissor_lift: Select a scissor lift.
  store:
    purchases:
      create:
        no_borrower: Enter who is checking out.
        notice: The checkout is complete.
  shifts:
    create:
      notice: The shift was added.
      error: The shift couldn't be added. Check it and try again.
    upload_csv:
      csv_not_uploaded: No CSV file was uploaded. Choose a CSV file and try again.
      success: The shifts were imported.
    destroy:
      notice: The shift was deleted.
      error: The shift couldn't be deleted. Try again.
  tasks:
    complete:
      notice: The task was completed.
  tool_inventory_tools:
    create:
      notice: The tool was added.
    destroy:
      notice: The tool was removed.
  tool_types:
    destroy:
      no_delete: Cannot delete a tool type until all tools of that type are deleted.
  tools:
    create:
      notice: The tool was created.
    update:
      notice: The tool was updated.
      alert: The tool couldn't be updated. Check it and try again.
  faq:
    index:
      heading: Frequently Asked Questions
      general: General Questions
      empty: No questions yet.
      new: Add Question
      edit: Edit Question
      destroy: Delete Question
      confirm: Delete this question?
    new:
      heading: Add Question
    edit:
      heading: Edit Question
    create:
      alert: The question wasn't added. Correct the problems below.
      notice: The question was added to the FAQ.
    update:
      alert: The question wasn't updated. Correct the problems below.
      notice: The question was updated.
    destroy:
      alert: The question couldn't be deleted. Try again.
      notice: The question was deleted from the FAQ.
    form:
      cancel: Cancel
  participants:
    safety_briefings:
      update:
        alert: "Problem: %{errors}"
    waivers:
      form:
        cancel: Cancel
      update:
        alert: The waiver wasn't accepted. Correct the problems below.
        notice: The waiver for %{name} was submitted.
  sessions:
    create:
      alert: Binder couldn't find your account. %{message}
      help_link: Get help
    destroy:
      notice: You signed out.
    impersonate:
      not_found: Participant not found.
      not_allowed: Only administrators can act as someone else.
  welcome:
    html: <h1>Welcome, %{name}!</h1>
  organization_timeline_entries:
    create:
      alert: The entry couldn't be saved. Try again.
      already_queued: "You're already in the queue."
      structural_notice: Added to the structural queue.
      electrical_notice: Added to the electrical queue.
      downtime_notice: Downtime started.
    end:
      notice: Removed from the queue.
    destroy:
      notice: The entry was removed from the downtime tracker.

  # Views: Form helpers
  helpers:
    label:
      faq:
        question: Question
        answer: Answer
        organization_category: Show This Question To
    submit:
      create: Create %{model}
      update: Save Changes to %{model}
    actions: Actions
    links:
      add: Add
      edit: Edit
      new: New
      update: Update
      show: View
      destroy: Delete
      back: Back
      cancel: Cancel
      submit: Save
      checkout: Check Out
      checkin: Check In
      add_to_cart: Add to Cart
      remove_from_cart: Remove From Cart
      complete: Complete
      confirm: Are you sure?
      new_item: New Store Item
      new_charge: New Charge
      new_task: New Task
      new_shift_participant: Clock In

  # Models
  activerecord:
    models:
      faq: Question
    attributes:
      task:
        due_at: Due At
      participant:
        safety_briefing_expected_end_at: Safety briefing completion time
    errors:
      models:
        participant:
          attributes:
            safety_briefing_expected_end_at:
              less_than: too soon. Now watch it again from the beginning.
            name_confirmation:
              confirmation: doesn't match name above
            phone_number:
              format: should be 10 digits (area code needed) and separated by dashes only
    # OLD
    attributes_OLD:
      shift:
        shift_participants: Participants
        shift_type: Type
      charge:
        charge_type: Type
        issuing_participant: Issued By
        receiving_participant: Issued To
        charged_at: Time
        is_approved: Approved?
      organization:
        organization_category: Division
  errors:
    messages:
      tool_already_checked_out: The tool you selected is already checked out. Return it before continuing.
      tool_already_checked_in: The tool you selected is already checked in.
      tool_does_not_exist: The tool barcode you entered isn't registered. Register it first.
      tool_is_not_hardhat: This page can only check hardhats out or in.
      participant_does_not_exist: The participant or ID card you selected is invalid. Try again, or contact an administrator if you think this message is wrong.
      organization_does_not_exist: The organization you selected does not exist.
  will_paginate:
    previous_label: «
    next_label: »
  flash:
    actions:
      create:
        notice: "%{resource_name} was created."
      update:
        notice: "%{resource_name} was updated."
      destroy:
        notice: "%{resource_name} was deleted."
        alert: "%{resource_name} could not be deleted."
    charges:
      approve:
        notice: The charge's approval was changed.
        alert: The charge's approval couldn't be changed. Try again.
